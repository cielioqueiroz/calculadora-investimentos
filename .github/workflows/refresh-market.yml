name: Atualiza cotacoes da B3

# O snapshot da B3 e gerado no build da Vercel. Este workflow so dispara
# um novo deploy durante o pregao para que as cotacoes nao envelhecam.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 12-21 * * 1-5'

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispara o deploy hook
        # O segredo chega por env em vez de interpolado no shell, para que o
        # seu conteudo nunca vire parte do comando executado.
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK ausente; nada a fazer."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" -o /dev/null
