<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta

      content="Simule e compare rendimentos de investimentos brasileiros, com mercado em tempo real da B3, cripto e câmbio."
    />
    <meta name="theme-color" content="#0B0C0E" />
    <title>InvestCalc | Calculadora de Investimentos</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InvestCalc" />
    <meta property="og:title" content="InvestCalc | Calculadora de Investimentos" />
    <meta
      property="og:description"
      content="Simulador de juros compostos, retorno real, planejador de meta e mercado em tempo real (B3, cripto e câmbio). Tudo no navegador, sem backend."
    />
    <meta
      property="og:url"
      content="https://cielioqueiroz.github.io/calculadora-investimentos/"
    />
    <meta
      property="og:image"
      content="https://cielioqueiroz.github.io/calculadora-investimentos/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="InvestCalc | Calculadora de Investimentos"
    />
    <meta
      name="twitter:description"
      content="Simulador completo e mercado em tempo real (B3, cripto e câmbio). Tudo no navegador, sem backend."
    />
    <meta
      name="twitter:image"
      content="https://cielioqueiroz.github.io/calculadora-investimentos/og-image.png"
    />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Restores the original route after the 404.html redirect.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        const stored = JSON.parse(
          localStorage.getItem('investment-calculator:preferences'),
        )
        const prefs = stored && stored.state ? stored.state : {}
        const theme = prefs.theme || 'dark'
        if (theme === 'dark') document.documentElement.classList.add('dark')
        if (prefs.locale) document.documentElement.lang = prefs.locale
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
