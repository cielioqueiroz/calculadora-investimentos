<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calcule quanto rende poupança, CDB, LCI, Tesouro Direto, ações e cripto, com IR e inflação descontados. Cotações da B3, câmbio e cripto atualizadas."
    />
    <meta name="theme-color" content="#0B0C0E" />
    <title>Rendimento — Calculadora de investimentos</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rendimento" />
    <meta property="og:title" content="Rendimento — Calculadora de investimentos" />
    <meta
      property="og:description"
      content="Juros compostos com IR, IOF e inflação descontados, comparação entre aplicações e cotações da B3, câmbio e cripto."
    />
    <meta property="og:url" content="https://rendimento.vercel.app/" />
    <meta property="og:image" content="https://rendimento.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rendimento — Calculadora de investimentos" />
    <meta
      name="twitter:description"
      content="Juros compostos com IR, IOF e inflação descontados, e cotações da B3, câmbio e cripto."
    />
    <meta
      name="twitter:image"
      content="https://rendimento.vercel.app/og-image.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        const stored = JSON.parse(
          localStorage.getItem('investment-calculator:preferences'),
        )
        const prefs = stored && stored.state ? stored.state : {}
        const theme = prefs.theme || 'dark'
        if (theme === 'dark') document.documentElement.classList.add('dark')
        if (prefs.locale) document.documentElement.lang = prefs.locale
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
